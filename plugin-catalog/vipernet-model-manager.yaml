#   substituicao esta declarada nos dois README.
#   As imagens sao as da 3.47.8: abrem no sha novo (os bytes sao os mesmos,
#   assets/ nao mudou desde entao) mas o cabecalho do painel nelas mostra
#   3.47.8. Fica declarado — recapturar exige uma sessao com o painel a 3.47.11.
#
# NOTA DE CONSTRUCAO: o `sha` abaixo nao pode apontar para o commit que contem
#   esta versao do ficheiro (um ficheiro nao se cita a si mesmo). Aponta para o
