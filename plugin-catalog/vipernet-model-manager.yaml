name: vipernet-model-manager
repo: https://gitea.home.server/proldan/vipernet-model-manager.git

# Commit EXATO do catalogo, 40 hex — resolvido por `git rev-parse`, nunca
# completado de memoria. Merge do PR #11 em `main` (Gitea), 2026-11-07.
sha: "d779ee9250dbb335a7955713508cc3755b81ae44"

description: >-
  Picks the provider and model for each turn from the profile's own catalog,
  based on the kind of work detected in the message: declared task associations
  first, then an automatic complexity analysis. Keeps the choice stable for the
  whole session, records every decision in an append-only ledger and degrades to
  the next route instead of failing when a route has no credential.

maintainer: proldan
tier: community
category: models
requires_hermes: ">=0.22.0"
version: "3.47.6"
title: Vipernet Model Manager
readme: true

# Capacidades = o que o plugin regista de facto em `__init__.py`. O validador
# confirma-as no pin (`declared middleware — matches registrations`).
capabilities:
  provides_tools: []
  provides_hooks:
    - post_api_request
    - api_request_error
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
