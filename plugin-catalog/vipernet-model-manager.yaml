# Entrada de catalogo do Vipernet Model Manager.
#
# Esta copia vive no repositorio do plugin para que o que se publica seja
# versionado com o codigo. O ficheiro que se submete no PR e' este, tal como
# esta' no commit de topo do `main`.
#
# DECISAO DO DONO (2026-11-07): o catalogo publico e' servido pelo repositorio
# PUBLICO no GitHub (regra 2: URL https que qualquer pessoa clone). O Gitea
# interno continua a ser onde o trabalho acontece; o `main` de la' e' empurrado
# por push mirror para o `main` do GitHub, preservando o sha.
#
# Esquema lido de `hermes_cli/plugin_catalog.py` (dataclass PluginCatalogEntry,
# 19 campos): o loader recusa `repo` sem https://, `sha` que nao seja 40 hex,
# `tier` fora de official/verified/community e `category` fora de
# desktop/memory/platform/web/tools/voice/automation/models/general. Verificado
# com o parser do proprio core (`hermes_yaml`) — 19 campos, zero chaves
# descartadas em silencio.
#
# ---------------------------------------------------------------------------
# ESTADO MEDIDO 2026-11-08 10:45 WET
# ---------------------------------------------------------------------------
# Pin: `main` do repositorio do plugin depois do merge do PR #22, que leva a
#   3.47.11. Desde o pin anterior (fc4fc2a3 / 3.47.8):
#   - 3.47.9 — o campo do provider no formulario de um modelo deixa de ser
#     lista fechada: aceita texto livre, com sugestoes dos providers servidos
#     pelo nucleo no perfil (era impossivel acrescentar um provider novo).
#   - 3.47.10 — o detector de tarefa deixa de associar por termo generico
#     sozinho (`sensor`, `entidade`, `automacao`) e o ledger passa a registar
#     a prova (`nivel_origem`, `tarefa_termo`, `tarefa_texto_sha`).
#   - 3.47.11 — dois termos genericos juntos tambem deixam de associar: exige-se
#     sempre um termo especifico da tarefa.
#   Medido sobre 838 mensagens de utilizador em 48 h no perfil `default`:
#   36 atribuicoes pela regra anterior, 36 pela nova, 0 perdidas.
#   Regra 2 e regra 9 como abaixo; `hermes plugins validate` no pin responde
#   `Validation passed` (16 verificacoes, `no core override`, security scan
#   `safe`).
#
# Regra 2 (repo clonavel por https, anonimamente): OK no GitHub.
#   Provado por clone anonimo, nao pelo auto-relato do espelho:
#     env -i HOME=<vazio> GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone
#       https://github.com/ptv1p3r/vipernet-model-manager  -> rc 0
#   e o `main` do GitHub estava neste sha. Entrypoints no pin: `plugin.yaml`,
#   `__init__.py`, `dashboard/manifest.json`, `README.md`.
#
# Regra 9 (so superficies publicas): OK, sem excecao. `seams.py` usa
#   `agent.credential_pool.load_pool` desde a 3.47.0; `hermes plugins validate`
#   responde `no core override` e nao assinala nenhum import nem chamada privada.
#
# Pagina de documentacao: e' construida a partir do `README.md` DESTE commit
#   (`readme: true`), e a seccao «Public catalogue readiness» ja' diz o estado
#   medido — nao ha ressalva pendente.
#
# `screenshots:` — tres capturas do painel na versao pinada, tiradas de uma
#   instalacao viva (v3.47.8, separador Model Manager), guardadas em `assets/`
