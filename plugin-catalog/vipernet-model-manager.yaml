# Capacidades = o que o plugin regista de facto em `__init__.py`. O validador
# confirma-as no pin (`declared hooks/middleware — matches registrations`).
capabilities:
  provides_tools: []
  provides_hooks:
    - post_api_request
    - api_request_error
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
