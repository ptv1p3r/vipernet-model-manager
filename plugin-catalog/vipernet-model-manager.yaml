# Entrada de catalogo do Vipernet Model Manager.
#
# Destino: `plugin-catalog/vipernet-model-manager.yaml` no repositorio
# `NousResearch/hermes-agent`, por PR com revisao humana. Esta copia vive no
# repositorio do plugin para que o que se submete seja versionado com o codigo
# e nao se perca numa conversa.
#
# Esquema lido de `hermes_cli/plugin_catalog.py` (dataclass PluginCatalogEntry):
# o loader recusa `repo` que nao comece por https://, `sha` que nao seja 40 hex,
# `tier` fora de official/verified/community e `category` fora de
# desktop/memory/platform/web/tools/voice/automation/models/general.
#
# ESTADO 2026-11-07: regra 2 SATISFEITA E MEDIDA.
# `repo` aponta ao repositorio publico do GitHub. O pin foi clonado por https
# (clone independente, nao o diretorio local) e validado com o mesmo comando
# que o CI do catalogo corre:
#   hermes plugins validate /opt/data/cache/scratch/gh-pin-check --install-deps
# resultado: rc 0, "Validation passed", plugin carregavel em __init__.py.
# No pin existem 72 ficheiros versionados, com `plugin.yaml`, `__init__.py`,
# `dashboard/manifest.json` e `README.md` (ingles primeiro, PT em
# `README.pt-PT.md`), que e' o que a pagina /docs/plugins/<name> renderiza.
#
# Resta um aviso de REGRA 9 (import de modulo core nao documentado) em dois
# ficheiros de ferramenta de desenvolvimento: `seams.py:45` e
# `eval/aprender.py:164`, ambos `hermes_cli.runtime_provider.
# resolve_runtime_provider`. O runtime do plugin nao os importa (so o
# `selftest.py` os simula), mas enquanto estiverem na arvore publicada a regra 9
# e' motivo de recusa. Ver `references/admissao-ao-catalogo.md` na skill.

name: vipernet-model-manager
repo: https://github.com/ptv1p3r/vipernet-model-manager

# OBRIGATORIO: o commit EXATO que o revisor leu, 40 caracteres hexadecimais.
# Pin medido por `git ls-remote https://github.com/ptv1p3r/...` e confirmado por
# clone independente a 2026-11-07: HEAD de `main` =
# 03985e1ddcfa5b8a7a0e07ab1f9f1a74c574b5e6, `version: 3.45.1` no `plugin.yaml`
# e no `dashboard/manifest.json`. A `version` da entrada e' a do codigo NO PIN,
# nunca a do disco local (que esta em 3.46.0): a regra 14 exige que coincidam.
sha: "03985e1ddcfa5b8a7a0e07ab1f9f1a74c574b5e6"

description: >-
  Picks the provider and model for each turn from the profile's own catalog,
  based on the kind of work detected in the message: declared task associations
  first, then an automatic complexity analysis. Keeps the choice stable for the
  whole session, records every decision in an append-only ledger and degrades to
  the next route instead of failing when a route has no credential.

maintainer: proldan
tier: community
category: models
requires_hermes: ">=0.22.0"
version: "3.45.1"
title: Vipernet Model Manager
readme: true

# Capacidades declaradas = o que o plugin regista de facto em `__init__.py`.
# Regra 6 do catalogo: uma capacidade por declarar e' falha de validacao, uma
# capacidade declarada a mais e' deriva. `post_tool_call` entrou na 3.35.0 (mede
# o `exit_code` de cada chamada) e ficou por declarar ate' 2026-11-05.
capabilities:
  provides_tools: []
  provides_hooks:
    - post_api_request
    - api_request_error
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []

# PENDENTE antes do PR: `screenshots` (a regra pede capturas para tudo o que
# tem UI, e este plugin tem um painel de dashboard). Nao ha URLs inventados
# aqui: as capturas exigem uma sessao autenticada no browser do painel, que
# ainda nao foi exercitada. Ate existirem, a galeria da pagina fica vazia e o
# revisor ve o README so.
