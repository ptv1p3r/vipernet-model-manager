# Entrada de catalogo do Vipernet Model Manager.
#
# Destino: `plugin-catalog/vipernet-model-manager.yaml` no repositorio
# `NousResearch/hermes-agent`, por PR com revisao humana. Esta copia vive no
# repositorio do plugin para que o que se submete seja versionado com o codigo.
#
# Esquema lido de `hermes_cli/plugin_catalog.py` (dataclass PluginCatalogEntry,
# 19 campos): o loader recusa `repo` sem https://, `sha` que nao seja 40 hex,
# `tier` fora de official/verified/community e `category` fora de
# desktop/memory/platform/web/tools/voice/automation/models/general. Verificado
# com o parser do proprio core (`hermes_yaml`), nao a olho.
#
# ---------------------------------------------------------------------------
# ESTADO MEDIDO 2026-11-07 — LEIA ANTES DE ABRIR O PR
# ---------------------------------------------------------------------------
# Regra 2 (repo publico clonavel por https + plugin carregavel no pin): OK.
#   repo  https://github.com/ptv1p3r/vipernet-model-manager
#   O commit pinado abaixo foi trazido por `git fetch` do GitHub e validado com
#   o MESMO comando do CI: `hermes plugins validate <dir> --install-deps`.
#   `Validation passed`, plugin carregavel por `__init__.py`, `README.md`
#   ingles-primeiro (PT em `README.pt-PT.md`) — e' desse README que a pagina
#   /docs/plugins/<nome> e' construida.
#
# Regra 9 (so superficies publicas): BLOQUEIA A SUBMISSAO AINDA.
#   No commit publico 45291b10 (3.46.0) o validador acusa:
#     eval/aprender.py:164  hermes_cli.runtime_provider.resolve_runtime_provider
#     seams.py:45           hermes_cli.runtime_provider.resolve_runtime_provider
#   A correcao JA ESTA FEITA e provada fora do GitHub: no Gitea, ramo `dev`,
#   commit b1cc51cc5be1d188a3c50b555b16ea065fc3883c (version 3.47.0), o
#   `seams.py` resolve credenciais por `agent.credential_pool.load_pool`
#   (superficie publica) e o validador responde `no core override — no runtime
#   rebinds of Hermes core`. Falta esse commit chegar ao GitHub.
#
# Porque nao chegou: o Gitea tem UM push mirror para o GitHub
# (`remote_mirror_OgpOX3SFYj`, intervalo 8h, sync_on_commit) e o token dele
# esta morto — `last_error: Invalid username or token. Password authentication
# is not supported for Git operations` a 2026-11-07T16:50:12Z. Sem token
# valido, o GitHub nao recebe a 3.47.0 e este pin nao pode avancar.
#
# ENTREGA: assim que o `dev` chegar ao GitHub, trocar `sha` pelo commit que
# contem a 3.47.0 e `version` para 3.47.0 (a regra exige que `version` da
# entrada seja a do codigo NO PIN, nao a do disco).
#
# PENDENTE: `screenshots` — o plugin tem painel de dashboard e a regra pede
# capturas, tiradas depois da correcao e de uma sessao autenticada. Nao ha URLs
# inventados aqui: sem capturas reais a galeria fica vazia.
# ---------------------------------------------------------------------------

name: vipernet-model-manager
repo: https://github.com/ptv1p3r/vipernet-model-manager

# Commit EXATO que o revisor le, 40 hex. Este e' o HEAD real do repositorio
# publico hoje (merge do PR #1, 2026-11-07T16:50:32Z). NAO e' o commit que se
# quer submeter: e' o que existe. Ver a nota de regra 9 acima.
sha: "45291b1099afd149d524a8f510b6a93b9bdca15a"

description: >-
  Picks the provider and model for each turn from the profile's own catalog,
  based on the kind of work detected in the message: declared task associations
  first, then an automatic complexity analysis. Keeps the choice stable for the
  whole session, records every decision in an append-only ledger and degrades to
  the next route instead of failing when a route has no credential.

maintainer: proldan
tier: community
category: models
requires_hermes: ">=0.22.0"
version: "3.46.0"
title: Vipernet Model Manager
readme: true

# Capacidades = o que o plugin regista de facto em `__init__.py`. Uma capacidade
# por declarar e' falha de validacao; uma a mais e' deriva.
capabilities:
  provides_tools: []
  provides_hooks:
    - post_api_request
    - api_request_error
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
