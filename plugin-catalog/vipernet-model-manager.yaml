name: vipernet-model-manager
repo: https://github.com/ptv1p3r/vipernet-model-manager.git

# Commit EXATO do catalogo, 40 hex — resolvido por `git rev-parse` nos dois
# lados (Gitea e GitHub), nunca completado de memoria. `main` do GitHub relido
# por `git ls-remote` a 2026-11-08: d28494b4.
sha: "d28494b44e294604aae32c58794ccb96a0b6cfbe"

description: >-
  Picks the provider and model for each turn from the profile's own catalog,
  based on the kind of work detected in the message: declared task associations
  first, then an automatic complexity analysis. Keeps the choice stable for the
  whole session, records every decision in an append-only ledger and degrades to
  the next route instead of failing when a route has no credential.

maintainer: proldan
tier: community
category: models
requires_hermes: ">=0.22.0"
version: "3.47.11"
title: Vipernet Model Manager
readme: true

# Galeria de /docs/plugins/vipernet-model-manager. URLs no sha do pin: um bump
# de pin obriga a re-pinar as imagens (regra 4).
screenshots:
  - https://raw.githubusercontent.com/ptv1p3r/vipernet-model-manager/d28494b44e294604aae32c58794ccb96a0b6cfbe/assets/01-visao-geral.png
  - https://raw.githubusercontent.com/ptv1p3r/vipernet-model-manager/d28494b44e294604aae32c58794ccb96a0b6cfbe/assets/02-configuracao.png
  - https://raw.githubusercontent.com/ptv1p3r/vipernet-model-manager/d28494b44e294604aae32c58794ccb96a0b6cfbe/assets/03-registo.png

# Capacidades = o que o plugin regista de facto em `__init__.py`. O validador
# confirma-as no pin (`declared hooks/middleware — matches registrations`).
capabilities:
  provides_tools: []
  provides_hooks:
    - post_api_request
    - api_request_error
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
