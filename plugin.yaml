name: vipernet-model-manager
version: 3.47.2
requires_hermes: ">=0.22.0"
description: "Escolhe o provider+modelo do turno pela complexidade do trabalho, dentro do catalogo que o dono declarou PARA O PERFIL servido. A complexidade e analisada (nao escrita a mao) a partir da ultima mensagem e do estado do trabalho; o marcador `complexidade: alta` continua como override. Cada perfil tem o seu interruptor, a sua estrategia (rodizio por turno/sessao, ou prioridade), os seus limiares e o seu catalogo de (provider, modelo, complexidade, acesso). A rota de acesso (`api` ou `subscricao`) e explicita ou inferida do provider (openai-codex=subscricao, restantes=api), nunca convertida: incompatibilidades sao recusadas. Perfis ausentes da config nao sao tocados. Troca o agente vivo via `agent.switch_model` (cliente HTTP, chave, base_url e api_mode mudam juntos). O ledger de `resposta` regista provider e modelo efectivos, response_model, superficie, acesso, tarefa/complexidade e a correlacao request_id. Fail-open: sem decisao, sem rota ou com credencial ausente o pedido segue intacto e a razao vai para uso.err. Cada rota pode declarar `esforco` (baixo/medio/alto): e escrito no `reasoning_config` do agente para os turnos seguintes e no payload do proprio turno, na forma que o perfil do provider de destino entende (`thinking`+`reasoning_effort` no deepseek, `reasoning` no OpenRouter), e reposto ao valor de origem quando a rota seguinte nao o declara. O modelo classificador aceita o mesmo campo. As superficies tem duas camadas e nao se confundem: a do perfil (`analise.superficies`, superficie -> rota) decide QUEM serve a superficie da sessao; a do modelo (`catalogo[i].superficies`, superficie -> booleano) decide SE aquele modelo a pode servir, com heranca quando a chave esta ausente e `*` para as superficies nao nomeadas. A camada do modelo ganha ao pin e a regra do perfil, que cedem com motivo declarado (`rota_pinada:nao_serve_superficie:<sup>` e `superficie:<nome>:modelo_nao_serve`) em vez de servirem em silencio. A associacao de tarefa persiste na sessao (`analise.tarefa_persistente`: activo, expira_turnos, expira_min) e cada decisao regista `tarefa_origem` (detectada/herdada) e `tarefa_idade_turnos`: a tarefa detectada num turno serve os seguintes ate o prazo esgotar ou ate o marcador `complexidade: auto` a largar, para que o modelo nao mude a meio da conversa. Um modelo que falha deixa de ser candidato temporariamente: o circuit breaker (activo, limite_falhas, janela_minutos, multiplicador_cooldown) conta as falhas por perfil/provider/modelo numa janela e multiplica o cooldown negativo, global ou por perfil com heranca chave a chave. O idioma tem uma so fonte, a chave `idioma` da config, com ingles (padrao) e portugues de Portugal: o painel (todas as opcoes), as recusas proprias da API do painel e a ajuda do CLI (`vmm --help`) mudam com ela, e os dois README sao as duas versoes completas. O validador do `gestor.py` fala a mesma lingua (75 mensagens traduzidas por chave, no `i18n.py`), tal como a ajuda do CLI: a recusa sai traduzida tanto pela `detail` do painel como pela linha do CLI, sem metade da frase numa lingua e metade na outra. A saida dos proprios comandos tambem: os 140 moldes distintos do `cli.py` (208 chamadas ao tradutor) passam pela mesma chave, com os marcadores validados um a um antes de escrever, e a ajuda do `-h`, que o `argparse` gera em ingles, tem chave propria. Ficam de fora, de proposito, as palavras que o utilizador escreve na config (`catalogo`, `acesso`, `superficie`, `entrada`, `nivel`, `tarefa`, `modo`, `por`, `termos`, `prioridade`): sao identificadores que o plugin le, e vertê-las mandaria escrever uma chave que ele nao conhece. A formatacao de valores vive num so modulo (`formato.py`), com o locale passado explicitamente: datas, numeros, percentagens e moedas seguem o mesmo idioma, e por isso em pt-PT o separador de milhares e espaco (U+00A0), a virgula e decimal, quatro digitos nao se agrupam e o simbolo de moeda vai depois do valor, enquanto em en o milhar e virgula. O ledger e o texto de diagnostico ficam deliberadamente neutros (ponto decimal, sem agrupamento): a prova gravada tem de ser comparavel entre sessoes, independentemente da lingua de quem a escreveu. A guarda que impede formatacao fora do `formato.py` nao e uma lista de formas proibidas — e a classe: especificador numerico em f-string (incluindo spec montado em tempo de execucao), `%`-format numerico, `format()` com spec, `strftime`, simbolo monetario por categoria Unicode `Sc` (com os literais de regex isentos por estrutura, por `$` nao ser moeda), molde de traducao com especificador, codigo ISO colado a frase e valor cru com unidade colada (`f\"{n}tok\"`) — mais a mesma classe no painel, onde so os auxiliares declarados falam com o `Intl`. As isencoes sao declaradas por ficheiro e por tipo, com razao escrita, e uma isencao cujo sitio desapareceu falha o teste em vez de o deixar passar: fixtures de formas que nao pertencem a lista nenhuma provam que uma variante nova e apanhada."
author: "Pedro Tiago de Jesus Estevanez Roldan"
# `homepage` e o campo que o loader le e que o catalogo mostra; o `repository`
# NAO existe neste manifesto (28 campos, nenhum e esse) e seria descartado em
# silencio. Aponta ao repositorio PUBLICO (GitHub), que e' o que a regra 2 do
# catalogo exige: clonavel por https, com o plugin carregavel no commit pinado.
# A escrita continua a ser so no Gitea (regra do dono): o GitHub e' a vitrine de
# submissao e avanca quando o dono autorizar escrita la.
homepage: "https://github.com/ptv1p3r/vipernet-model-manager"
kind: standalone
# Variaveis de ambiente que o plugin LE. Nenhuma e credencial: sao interruptores
# (aceitam 1/on/true/sim) e um override de directoria usado so pelos testes.
# Declaradas aqui para que a capacidade declarada case com o que o codigo faz
# (regra 6); `optional_env` nao as torna obrigatorias na instalacao.
optional_env:
  - name: VMM_DESATIVADO
    description: "Interruptor de emergencia: com 1/on/true/sim o plugin nao toca em nenhum pedido."
  - name: VIPERNET_MODEL_MANAGER_OFF
    description: "Alias do mesmo interruptor, para quem preferir o nome do plugin."
  - name: VMM_DIR
    description: "Directoria de dados alternativa (config e ledger). Usada pelos testes; nunca em producao."
provides_hooks:
  - post_api_request
  - api_request_error
  - post_tool_call
provides_middleware:
  - llm_request
hooks:
  - post_api_request
  - api_request_error
  - post_tool_call
