name: vipernet-model-manager
version: 3.23.3
requires_hermes: ">=0.22.0"
description: "Escolhe o provider+modelo do turno pela complexidade do trabalho, dentro do catalogo que o dono declarou PARA O PERFIL servido. A complexidade e analisada (nao escrita a mao) a partir da ultima mensagem e do estado do trabalho; o marcador `complexidade: alta` continua como override. Cada perfil tem o seu interruptor, a sua estrategia (rodizio por turno/sessao, ou prioridade), os seus limiares e o seu catalogo de (provider, modelo, complexidade, acesso). A rota de acesso (`api` ou `subscricao`) e explicita ou inferida do provider (openai-codex=subscricao, restantes=api), nunca convertida: incompatibilidades sao recusadas. Perfis ausentes da config nao sao tocados. Troca o agente vivo via `agent.switch_model` (cliente HTTP, chave, base_url e api_mode mudam juntos). O ledger de `resposta` regista provider e modelo efectivos, response_model, superficie, acesso, tarefa/complexidade e a correlacao request_id. Fail-open: sem decisao, sem rota ou com credencial ausente o pedido segue intacto e a razao vai para uso.err. Cada rota pode declarar `esforco` (baixo/medio/alto): e escrito no `reasoning_config` do agente para os turnos seguintes e no payload do proprio turno, na forma que o perfil do provider de destino entende (`thinking`+`reasoning_effort` no deepseek, `reasoning` no OpenRouter), e reposto ao valor de origem quando a rota seguinte nao o declara. O modelo classificador aceita o mesmo campo."
author: "Pedro Tiago de Jesus Estevanez Roldan"
kind: standalone
# Variaveis de ambiente que o plugin LE. Nenhuma e credencial: sao interruptores
# (aceitam 1/on/true/sim) e um override de directoria usado so pelos testes.
# Declaradas aqui para que a capacidade declarada case com o que o codigo faz
# (regra 6); `optional_env` nao as torna obrigatorias na instalacao.
optional_env:
  - name: VMM_DESATIVADO
    description: "Interruptor de emergencia: com 1/on/true/sim o plugin nao toca em nenhum pedido."
  - name: VIPERNET_MODEL_MANAGER_OFF
    description: "Alias do mesmo interruptor, para quem preferir o nome do plugin."
  - name: VMM_DIR
    description: "Directoria de dados alternativa (config e ledger). Usada pelos testes; nunca em producao."
provides_hooks:
  - post_api_request
provides_middleware:
  - llm_request
hooks:
  - post_api_request
