name: vipernet-model-manager
version: 3.41.0
requires_hermes: ">=0.22.0"
description: "Escolhe o provider+modelo do turno pela complexidade do trabalho, dentro do catalogo que o dono declarou PARA O PERFIL servido. A complexidade e analisada (nao escrita a mao) a partir da ultima mensagem e do estado do trabalho; o marcador `complexidade: alta` continua como override. Cada perfil tem o seu interruptor, a sua estrategia (rodizio por turno/sessao, ou prioridade), os seus limiares e o seu catalogo de (provider, modelo, complexidade, acesso). A rota de acesso (`api` ou `subscricao`) e explicita ou inferida do provider (openai-codex=subscricao, restantes=api), nunca convertida: incompatibilidades sao recusadas. Perfis ausentes da config nao sao tocados. Troca o agente vivo via `agent.switch_model` (cliente HTTP, chave, base_url e api_mode mudam juntos). O ledger de `resposta` regista provider e modelo efectivos, response_model, superficie, acesso, tarefa/complexidade e a correlacao request_id. Fail-open: sem decisao, sem rota ou com credencial ausente o pedido segue intacto e a razao vai para uso.err. Cada rota pode declarar `esforco` (baixo/medio/alto): e escrito no `reasoning_config` do agente para os turnos seguintes e no payload do proprio turno, na forma que o perfil do provider de destino entende (`thinking`+`reasoning_effort` no deepseek, `reasoning` no OpenRouter), e reposto ao valor de origem quando a rota seguinte nao o declara. O modelo classificador aceita o mesmo campo. As superficies tem duas camadas e nao se confundem: a do perfil (`analise.superficies`, superficie -> rota) decide QUEM serve a superficie da sessao; a do modelo (`catalogo[i].superficies`, superficie -> booleano) decide SE aquele modelo a pode servir, com heranca quando a chave esta ausente e `*` para as superficies nao nomeadas. A camada do modelo ganha ao pin e a regra do perfil, que cedem com motivo declarado (`rota_pinada:nao_serve_superficie:<sup>` e `superficie:<nome>:modelo_nao_serve`) em vez de servirem em silencio. A associacao de tarefa persiste na sessao (`analise.tarefa_persistente`: activo, expira_turnos, expira_min) e cada decisao regista `tarefa_origem` (detectada/herdada) e `tarefa_idade_turnos`: a tarefa detectada num turno serve os seguintes ate o prazo esgotar ou ate o marcador `complexidade: auto` a largar, para que o modelo nao mude a meio da conversa. Um modelo que falha deixa de ser candidato temporariamente: o circuit breaker (activo, limite_falhas, janela_minutos, multiplicador_cooldown) conta as falhas por perfil/provider/modelo numa janela e multiplica o cooldown negativo, global ou por perfil com heranca chave a chave. O painel e o README existem em ingles (padrao) e portugues de Portugal, escolhidos pela chave `idioma` na config, para painel, CLI e sessoes lerem a mesma escolha."
author: "Pedro Tiago de Jesus Estevanez Roldan"
# `homepage` e o campo que o loader le e que o catalogo mostra; o `repository`
# NAO existe neste manifesto (28 campos, nenhum e esse) e seria descartado em
# silencio. Aponta ao repositorio real deste plugin, o Gitea interno — nao ha
# espelho nem publicacao em GitHub (regra do dono). A submissao ao catalogo
# continua bloqueada por outro motivo: a regra 2 do catalogo pede um repositorio
# publico clonavel por https, que um Gitea em RFC1918 nao satisfaz.
homepage: "https://gitea.home.server/proldan/vipernet-model-manager"
kind: standalone
# Variaveis de ambiente que o plugin LE. Nenhuma e credencial: sao interruptores
# (aceitam 1/on/true/sim) e um override de directoria usado so pelos testes.
# Declaradas aqui para que a capacidade declarada case com o que o codigo faz
# (regra 6); `optional_env` nao as torna obrigatorias na instalacao.
optional_env:
  - name: VMM_DESATIVADO
    description: "Interruptor de emergencia: com 1/on/true/sim o plugin nao toca em nenhum pedido."
  - name: VIPERNET_MODEL_MANAGER_OFF
    description: "Alias do mesmo interruptor, para quem preferir o nome do plugin."
  - name: VMM_DIR
    description: "Directoria de dados alternativa (config e ledger). Usada pelos testes; nunca em producao."
provides_hooks:
  - post_api_request
  - api_request_error
  - post_tool_call
provides_middleware:
  - llm_request
hooks:
  - post_api_request
  - api_request_error
  - post_tool_call
